spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
bereta.auth.bootstrap.email=${BOOTSTRAP_USER_EMAIL:}
bereta.auth.bootstrap.password=${BOOTSTRAP_USER_PASSWORD:}
bereta.auth.bootstrap.display-name=${BOOTSTRAP_USER_NAME:Responsable BERETA}
bereta.auth.mail.enabled=${BERETA_MAIL_ENABLED:false}
bereta.auth.mail.from=${MAIL_FROM:}
bereta.auth.reset.base-url=${BERETA_PASSWORD_RESET_BASE_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
