spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.mvc.problemdetails.enabled=true
server.port=8081
# Derrière un reverse proxy (HTTPS), mettre "framework" pour lire X-Forwarded-For (IP réelle).
server.forward-headers-strategy=${BERETA_FORWARD_HEADERS:none}

# Compte initial (facultatif)
bereta.auth.bootstrap.email=${BOOTSTRAP_USER_EMAIL:}
bereta.auth.bootstrap.phone=${BOOTSTRAP_USER_PHONE:}
bereta.auth.bootstrap.password=${BOOTSTRAP_USER_PASSWORD:}
bereta.auth.bootstrap.display-name=${BOOTSTRAP_USER_NAME:Responsable BERETA}

# Jetons : access token JWT signé HS256, refresh token en cookie HttpOnly
bereta.auth.jwt.secret=${JWT_SECRET:}
bereta.auth.jwt.access-ttl=PT15M
bereta.auth.refresh.ttl=P7D
bereta.auth.refresh.cookie-secure=${BERETA_REFRESH_COOKIE_SECURE:true}
# Clé HMAC des codes OTP ; par défaut dérivée de JWT_SECRET.
bereta.auth.otp.secret=${OTP_HASH_SECRET:${JWT_SECRET:}}
bereta.auth.reset.base-url=${BERETA_PASSWORD_RESET_BASE_URL:http://localhost:4200}

bereta.cors.allowed-origins=${BERETA_CORS_ALLOWED_ORIGINS:http://localhost:4200}
bereta.rate-limit.enabled=${BERETA_RATE_LIMIT_ENABLED:true}
bereta.phone.default-region=${BERETA_PHONE_DEFAULT_REGION:FR}

# SMS : log (développement, code affiché dans les logs) | brevo | twilio
bereta.sms.provider=${BERETA_SMS_PROVIDER:log}
bereta.sms.sender=${SMS_SENDER:BERETA}
bereta.sms.brevo.api-key=${BREVO_API_KEY:}
bereta.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
bereta.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
bereta.sms.twilio.from=${TWILIO_FROM:}

# E-mails : log (développement) | smtp
bereta.mail.provider=${BERETA_MAIL_PROVIDER:log}
bereta.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
