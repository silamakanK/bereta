# Analyse SonarQube Cloud lancée par GitHub Actions (.github/workflows/ci.yml, job "sonar").
# Vérifiez la clé et l'organisation dans SonarQube Cloud : Administration > Update key / Information.
sonar.projectKey=silamakanK_bereta
sonar.organization=silamakank
sonar.projectName=BERETA
sonar.sourceEncoding=UTF-8

sonar.sources=bereta-backend/src/main,bereta-frontend/src
sonar.tests=bereta-backend/src/test,bereta-frontend/src
sonar.test.inclusions=bereta-backend/src/test/**,**/*.spec.ts

# Migrations Flyway : jamais modifiées une fois appliquées (faux positifs « VARCHAR2 »).
# db/vendor contient les variantes PostgreSQL et H2 de ces migrations.
sonar.exclusions=**/*.spec.ts,**/db/migration/**,**/db/vendor/**

sonar.java.binaries=bereta-backend/build/classes/java/main

sonar.coverage.jacoco.xmlReportPaths=bereta-backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=bereta-frontend/coverage/bereta/lcov.info
