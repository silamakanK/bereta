<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <a class="login-brand" routerLink="/" aria-label="BERETA, accueil"><span class="login-mark">B</span><span>bereta<span class="brand-dot">.</span></span></a>
    <h1 id="login-title">Connexion</h1>
    @if (errorMessage()) { <p class="login-error" role="alert">{{ errorMessage() }}</p> }
    <form novalidate (ngSubmit)="submit()">
      <label for="login-identifier">Téléphone ou e-mail</label>
      <input id="login-identifier" name="identifier" [(ngModel)]="identifier" autocomplete="username" required autofocus maxlength="320" placeholder="06 12 34 56 78" [attr.aria-invalid]="identifierError()" />

      <div class="password-label"><label for="login-password">Mot de passe</label><a routerLink="/mot-de-passe-oublie">Oublié ?</a></div>
      <div class="login-password-control"><input id="login-password" name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" autocomplete="current-password" required [attr.aria-invalid]="passwordError()" /><button class="password-toggle" type="button" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.aria-pressed]="showPassword()">{{ showPassword() ? 'Masquer' : 'Afficher' }}</button></div>

      <button class="login-submit" type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Connexion…' : 'Se connecter' }}</button>
    </form>
    <div class="login-divider"><span>ou</span></div>
    <a class="login-secondary" routerLink="/inscription">Créer un compte responsable</a>
    <p class="login-help">Trésorier ? Votre responsable vous donne vos identifiants.</p>
  </section>
</main>
