<main class="login-page">
  <section class="login-card" aria-labelledby="register-title">
    <a class="login-brand" routerLink="/" aria-label="BERETA, accueil"><span class="login-mark" aria-hidden="true"><img src="brand/bereta-icone-app.svg" alt="" width="38" height="38" /></span><span>bereta<span class="brand-dot">.</span></span></a>
    <h1 id="register-title">Créer un compte responsable</h1>
    @if (errorMessage()) { <p class="login-error" role="alert">{{ errorMessage() }}</p> }

    <form novalidate (ngSubmit)="submit()">
      <label for="register-phone">Téléphone</label>
      <input id="register-phone" name="phone" type="tel" [(ngModel)]="phone" autocomplete="tel" inputmode="tel" required autofocus maxlength="30" placeholder="06 12 34 56 78" [attr.aria-invalid]="phoneError()" aria-describedby="register-phone-help" />
      <span class="field-help" id="register-phone-help">Il vous servira pour vous connecter.</span>

      <label for="register-password">Mot de passe</label>
      <div class="login-password-control"><input id="register-password" name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" autocomplete="new-password" required maxlength="72" [attr.aria-invalid]="passwordError()" /><button class="password-toggle" type="button" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Masquer les mots de passe' : 'Afficher les mots de passe'" [attr.aria-pressed]="showPassword()">{{ showPassword() ? 'Masquer' : 'Afficher' }}</button></div>
      <app-password-strength [password]="password" />

      <label for="register-confirm-password">Confirmer le mot de passe</label>
      <input id="register-confirm-password" name="confirmPassword" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="confirmPassword" autocomplete="new-password" required [attr.aria-invalid]="confirmError()" />

      <label class="terms-choice"><input type="checkbox" name="acceptTerms" [(ngModel)]="acceptTerms" /> J’accepte les conditions d’utilisation.</label>

      <button class="login-submit" type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Création…' : 'Créer mon compte' }}</button>
    </form>
    <p class="login-help">Déjà un compte ? <a routerLink="/connexion">Se connecter</a></p>
  </section>
</main>
