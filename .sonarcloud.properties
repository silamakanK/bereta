# Configuration de l'analyse automatique SonarQube Cloud (pas de sonar-project.properties : ce fichier-ci
# est celui que lit l'analyse automatique, à la racine du dépôt).

# Migrations Flyway : écrites pour PostgreSQL, mais analysées comme du SQL Oracle (faux positifs
# « VARCHAR2 »). Elles ne doivent jamais être modifiées une fois appliquées : on les exclut de l'analyse.
# db/vendor contient aussi des migrations (variantes PostgreSQL et H2 de tests).
sonar.exclusions=**/db/migration/**,**/db/vendor/**
